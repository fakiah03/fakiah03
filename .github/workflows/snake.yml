name: Generate Lavender Contribution Snake 🐍💜

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Also run on push to main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate the lavender-themed contribution snake SVG files
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C3AED&color_dots=#EDE4FF,#C8B6F0,#A78BFA,#7C3AED,#29243A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFF0F6&color_dots=#29243A,#5B3E96,#7C3AED,#A78BFA,#C8B6F0

      # 2. Push the generated SVG files to the `output` branch
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
